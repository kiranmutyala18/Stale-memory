[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stalemem"
version = "0.2.0"
description = "Benchmark: does an assistant know when to trust, check, or drop a remembered fact?"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
stalemem = "stalemem.cli:main"

[tool.setuptools]
packages = ["stalemem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
